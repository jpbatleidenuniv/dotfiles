# Session name
rename-session '#{b:pane_current_path}'

# Window 1: dev, where the magic happens
# Left pane
rename-window editor
send-keys 'av; mkdir -p src/' Enter
run-shell "tmux send-keys 'nvim src/#{b:pane_current_path}' C-m" # Right pane
split-window -h -l 40%
send-keys C-l # Remove the fastfetch

# Window 2: script, where everything combines
# Left pane
new-window -n scripts
send-keys "av; mkdir -p scripts; nvim scripts/" Enter
# Right pane
split-window -h -l 40%
send-keys C-l

# Window 3: tests, where the misery happens
# Left pane
new-window -n tests
send-keys "av; mkdir -p tests; nvim tests/" Enter
# Right pane
split-window -h -l 40%
send-keys C-l

# Window 4: git, where you are being a good boy
new-window -n git 
send-keys "av" Enter
# I just want an empty single terminal

# Return to window 1, first pane:
select-window -t1
select-pane -t1
