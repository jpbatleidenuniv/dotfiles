# Use Ctrl-a as the tmux prefix (instead of the default Ctrl-b)
set -g prefix C-a
setw -g mode-keys vi
unbind C-b
bind C-a send-prefix

# Vim related
# Start selection with 'v'
bind-key -T copy-mode-vi v send-keys -X begin-selection 
 # Yank (copy) selection with 'y'
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Also yank on Enter key
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel   

bind C-R respawn-pane -k

# Easier session switching with <prefix> + s
bind s choose-session

# Easier session creating and killing
bind S command-prompt -p "New session:" "new-session -A -s '%%'"
bind K kill-session

# Reload tmux config
bind r source-file /home/jpb/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Window/pane indexing
set -g base-index 1
set -g pane-base-index 1

# Window settings
bind Space last-window

# Statusbar
set -g status-position top

# Pane style
set -g pane-border-lines simple

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'smart-splits-nvim/backend-tmux'
# what to do when the pane is against the edge of its tmux window. Mirrors
# smart-splits.nvim's `move.at_edge`, and should be kept in step with it:
#   wrap  => focus the pane on the far side (the default, and tmux's own behaviour)
#   stop  => do nothing
#   split => create a pane, inheriting the current pane's directory
set -g @smart-splits_at_edge 'wrap'
set -g @smart-splits_move_left_key  'C-h'
set -g @smart-splits_move_down_key  'C-j'
set -g @smart-splits_move_up_key    'C-k'
set -g @smart-splits_move_right_key 'C-l'

set -g @smart-splits_resize_left_key  'C-Left'
set -g @smart-splits_resize_down_key  'C-Down'
set -g @smart-splits_resize_up_key    'C-Up'
set -g @smart-splits_resize_right_key 'C-Right'

set -g @smart-splits_resize_step_size '3'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
